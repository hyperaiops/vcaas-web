# Apply in the existing agents namespace after pushing the application image.
# Required Secret webcontainer-env must contain PI_LITELLM_BASE_URL and
# PI_LITELLM_API_KEY, AUTH_CLIENT_SECRET and AUTH_SESSION_KEY (32-byte hex).
# Never commit real credentials to this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webcontainer
  namespace: agents
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webcontainer
  namespace: agents
rules:
  - apiGroups: [ubi.pi.dev]
    resources: [piworkers]
    verbs: [get, create, delete]
  # PiWorker creates bearer-token Secrets with generated names.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webcontainer
  namespace: agents
subjects:
  - kind: ServiceAccount
    name: webcontainer
    namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webcontainer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webcontainer-db
  namespace: agents
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webcontainer
  namespace: agents
  labels:
    app.kubernetes.io/name: webcontainer
spec:
  replicas: 1
  # SQLite and the in-memory RPC sessions require one application instance.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: webcontainer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webcontainer
    spec:
      serviceAccountName: webcontainer
      imagePullSecrets:
        - name: pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webcontainer
          image: ccr.ccs.tencentyun.com/vcaas/platform:agent-cleanup-20261025-232243
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            # Local port-forward debugging only. Disable this flag and use HTTPS for public access.
            - name: AUTH_ALLOW_HTTP_LOCALHOST
              value: "true"
            - name: AUTH_ORIGIN
              value: http://localhost:3000
            - name: AUTH_ISSUER
              value: https://vibe-coding-host.authing.cn/oidc
            - name: AUTH_CLIENT_ID
              value: 6aae0a13969a9131274d7e08
            - name: AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webcontainer-env
                  key: AUTH_CLIENT_SECRET
            - name: AUTH_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: webcontainer-env
                  key: AUTH_SESSION_KEY
            - name: PI_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WORKSPACE_FILES_ROOT
              value: /app/.data/workspaces
            - name: WORKSPACE_DB_PATH
              value: /app/.data/db/workspaces.db
            - name: SNAPSHOT_DIRECTORY
              value: /app/.data/snapshots
            - name: TEMPLATE_DIR
              value: /app/template
            # Reserved for the separate PVC/subPath integration.
            - name: PI_WORKSPACE_PVC_NAME
              value: my-agent-workspace
            # Server-to-agent RPC uses the internal ClusterIP Service, not Ingress.
            - name: PI_CONNECTION_MODE
              value: service
            - name: PI_LITELLM_MODEL
              value: glm-5.3-flash
            - name: PI_READY_TIMEOUT_MS
              value: "300000"
            - name: PI_WS_CONNECT_TIMEOUT_MS
              value: "180000"
            - name: PI_AGENT_IDLE_TIMEOUT_MS
              value: "600000"
          envFrom:
            - secretRef:
                name: webcontainer-env
          volumeMounts:
            - name: workspaces
              mountPath: /app/.data/workspaces
            - name: database
              mountPath: /app/.data/db
            - name: snapshots
              mountPath: /app/.data/snapshots
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        # Existing NFS PVC; do not replace or recreate it.
        - name: workspaces
          persistentVolumeClaim:
            claimName: my-agent-workspace
        - name: database
          persistentVolumeClaim:
            claimName: webcontainer-db
        - name: snapshots
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: webcontainer
  namespace: agents
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webcontainer
  ports:
    - name: http
      port: 3000
      targetPort: http
