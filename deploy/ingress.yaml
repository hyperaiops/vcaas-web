apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibe-coding
  namespace: agents
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vibe-coding.host
      secretName: vibe-coding-tls
  rules:
    - host: vibe-coding.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webcontainer
                port:
                  number: 3000
